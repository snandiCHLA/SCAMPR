name: lintr

on:
 push:
   branches: [ "main" ]
 pull_request:
   branches: [ "main" ]
 schedule:
   - cron: '29 6 * * 6'

permissions:
 contents: read

jobs:
 lintr:
   name: Run lintr scanning
   runs-on: ubuntu-latest
   permissions:
     contents: read
     security-events: write
     actions: read

   steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Install system dependencies
       run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

     - name: Set up R
       uses: r-lib/actions/setup-r@v2

     - name: Install pak and lintr
       run: |
         Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
         Rscript -e 'pak::pkg_install(c("lintr", "jsonlite", "sessioninfo"))'
       shell: bash

     - name: Run lintr on SCAMPR scripts
       run: |
         results <- lintr::lint_dir(path = "SCAMPR/Scripts")
         results <- c(results, lintr::lint_dir(path = "SCAMPR/Macros"))
         lintr::sarif_output(results, "lintr-results.sarif")
       shell: Rscript {0}
       continue-on-error: true

     - name: Upload analysis results to GitHub
       uses: github/codeql-action/upload-sarif@v3
       with:
         sarif_file: lintr-results.sarif
         wait-for-processing: true
